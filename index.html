<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ff">
<title>PM Desk · ระบบบริหารโครงการส่วนตัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcfbff;--card:#fff;--ink:#2b2540;--muted:#857c9c;--line:#eee9f7;--soft:#f7f4ff;
  --p:#8b5cf6;--p2:#a78bfa;--pk:#ec4899;--g:#10b981;--ps:#f2ecff;--pks:#fdeef6;--gs:#e7f9f1;
  --amber:#f59e0b;--red:#e5486f;
  --grad:linear-gradient(135deg,#a78bfa 0%,#e9a6f5 55%,#f9a8d4 100%);
  --shadow:0 1px 2px rgba(80,50,140,.04),0 10px 28px -14px rgba(120,80,200,.22);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 420px at 100% -5%,#fbe6f4 0,transparent 70%),radial-gradient(600px 460px at -5% 105%,#e2f8ee 0,transparent 70%),radial-gradient(500px 300px at 40% 0,#f1ebff 0,transparent 70%)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h3{margin:0;font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.sp{flex:1}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 20px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 16px -6px rgba(200,120,230,.7)}
.brand b{display:block;font-size:16px;line-height:1.2}.brand small{color:var(--muted);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:none;border-radius:12px;color:var(--muted);font-weight:500;text-align:left;width:100%;transition:.15s}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn.on{background:var(--ps);color:#6d3fe0}
.nav-btn .cnt{margin-left:auto;font-size:11px;background:var(--pks);color:var(--pk);padding:0 7px;border-radius:99px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px;line-height:1.5}
.wrap{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:22px 30px 6px;flex-wrap:wrap}
.top h1{font-size:23px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.3}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .acts{display:flex;gap:8px;margin-left:auto}
main{padding:14px 30px 110px}
.bnav,.fab{display:none}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--p2);background:var(--soft)}
.btn.pri{background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;border:0;box-shadow:0 6px 16px -6px rgba(168,85,247,.6)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.grn{background:var(--g);color:#fff;border:0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.back{padding:4px 6px}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{background:var(--pks);color:var(--pk)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.col{display:flex;flex-direction:column;gap:16px}
.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.two{grid-template-columns:1.25fr 1fr;align-items:start}
.stat{padding:16px 18px;position:relative;overflow:hidden}
.stat .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:8px;background:var(--ps);color:var(--p)}
.stat .k{color:var(--muted);font-size:13px}
.stat .v{font-size:30px;font-weight:600;line-height:1.15}
.stat.r .ico{background:var(--pks);color:var(--pk)}
.stat.g .ico{background:var(--gs);color:var(--g)}
.stat.a .ico{background:#f3e8ff;color:#a855f7}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#f5f0ff,#fdf0f7);border:1px dashed #d8c8fb;margin-bottom:16px;font-size:14px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:14px 4px;text-align:center}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 4px}
.lbl.late{color:var(--red)}

/* chips */
.chip{--c:#888;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:1px 9px;border-radius:99px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}

/* project rows (dashboard) */
.prow{padding:11px 10px;border-radius:12px;cursor:pointer;transition:.15s}
.prow:hover{background:var(--soft)}
.prow-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prow-top b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:7px;border-radius:99px;background:#f1edf8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:3px}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 10px;background:#f1edf8}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* task rows */
.trow{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:12px;transition:.15s}
.trow:hover{background:var(--soft)}
.chk{width:21px;height:21px;border-radius:7px;border:1.6px solid #cfc3ea;background:#fff;flex-shrink:0;margin-top:2px;display:grid;place-items:center;padding:0;color:#fff;transition:.15s}
.chk:hover{border-color:var(--g)}
.trow.done .chk{background:var(--g);border-color:var(--g)}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:500;line-height:1.4}
.pn i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px}
.pr{color:var(--red);background:var(--pks);padding:0 7px;border-radius:99px;font-weight:500}
.pr.low{color:var(--g);background:var(--gs)}
.st{color:var(--c);font-weight:500}
.due{white-space:nowrap}
.due.late{color:var(--red);font-weight:500}
.due.soon{color:#b45309}

/* projects */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-size:13.5px;color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pcard{cursor:pointer;padding:0;overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(120,80,200,.35)}
.pc-stripe{height:6px}
.pc-body{padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc-head{display:flex;gap:6px;flex-wrap:wrap}
.pcard h3{font-size:16.5px;line-height:1.4}
.pc-sub{font-size:13px;color:var(--muted)}
.pc-prog{display:flex;align-items:center;gap:10px;margin-top:auto}
.pc-prog .bar{flex:1}
.pc-prog b{font-size:14px;font-weight:600;min-width:38px;text-align:right}
.pc-foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding:10px 18px;flex-wrap:wrap}
.pc-foot span{display:inline-flex;align-items:center;gap:4px}
.late{color:var(--red)}
.phero{margin-bottom:16px;position:relative;overflow:hidden}
.phero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.phero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 14px}
.kv div small{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:500;font-size:14px}
.bigbar{height:10px;border-radius:99px;background:#f1edf8;overflow:hidden}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#f9a8d4));border-radius:99px}
.qadd{display:flex;gap:8px;margin-bottom:6px}
.qadd input{flex:1}
.nform{display:grid;gap:8px;margin-bottom:12px}
.nform button{justify-self:end}
.note{border-left:3px solid #d8c8fb;padding:6px 12px;margin:10px 0;background:linear-gradient(90deg,#faf7ff,transparent);border-radius:0 10px 10px 0}
.nd{display:flex;align-items:center;font-size:12.5px;color:var(--p);font-weight:500}
.nd .x{margin-left:auto;font-size:16px}
.nt{white-space:pre-wrap;font-size:14px}

/* inputs */
input[type=text],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;outline:none;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px #ede5ff}
textarea{resize:vertical}

/* board */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar select{width:auto;min-width:160px;max-width:260px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
.kcol{background:rgba(247,244,255,.75);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px;transition:.15s}
.kcol.over{background:#efe7ff;border-color:var(--p2)}
.kh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:2px 4px 10px}
.kn{background:#fff;border-radius:99px;font-size:12px;padding:0 8px;color:var(--muted);font-weight:500}
.kadd{margin-left:auto;padding:3px 6px}
.klist{display:flex;flex-direction:column;gap:9px}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:13px;padding:10px 12px;cursor:grab;box-shadow:0 2px 8px -6px rgba(90,60,160,.3);transition:.15s}
.kcard:hover{box-shadow:0 8px 18px -10px rgba(90,60,160,.4)}
.kcard.drag{opacity:.45}
.kcard.od{background:linear-gradient(180deg,#fff,#fff7fa)}
.kp{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt{font-weight:500;font-size:14px;line-height:1.4;margin:1px 0 2px}
.av{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:11px;display:inline-grid!important;place-items:center;font-weight:600;margin-left:auto}
.adv{border:0;background:var(--soft);border-radius:7px;padding:2px 5px;color:var(--p);display:inline-grid;place-items:center}
.adv:hover{background:var(--ps)}
.kempty{font-size:13px;color:#b8afcc;text-align:center;padding:22px 0;border:1.5px dashed #e3dbf3;border-radius:12px}

/* calendar */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calh h3{font-size:18px;min-width:150px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:12px;overflow:hidden}
.cw{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft);font-weight:500}
.cd{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.12s;min-width:0}
.cd:hover{background:#fcfaff}
.cd.out{background:#fdfcff}.cd.out .cdn{color:#cfc8dd}
.cdn{font-size:12.5px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cd.today .cdn{background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff}
.cev{--c:#a78bfa;font-size:11.5px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 80%,#2b2540);border-radius:6px;padding:1px 6px;display:flex;align-items:center;gap:3px;min-width:0}
.cev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev.pe{background:var(--c);color:#fff;font-weight:500}
.cev.dn{opacity:.5;text-decoration:line-through}
.mlist{margin-top:16px}
.mday{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mday:last-child{border:0}
.mdate{width:54px;flex-shrink:0;text-align:center;font-size:12px;color:var(--muted)}
.mdate b{display:block;font-size:20px;color:var(--ink);font-weight:600;line-height:1.1}
.mday .items{flex:1;min-width:0}

/* timeline */
.tl{overflow-x:auto}
.tl-in{min-width:820px}
.tl-head,.tl-row{display:flex}
.tl-name{width:220px;flex-shrink:0;padding:10px 12px 10px 0;font-size:13.5px;display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:500;min-width:0}
.tl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-name i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.tl-track{flex:1;position:relative;min-height:46px;border-bottom:1px solid var(--line)}
.tl-months{flex:1;position:relative;height:30px;border-bottom:1px solid var(--line)}
.tl-m{position:absolute;top:0;bottom:0;font-size:12px;color:var(--muted);padding:6px 6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tl-g{position:absolute;top:0;bottom:0;border-left:1px dashed #f0ebf8}
.tl-bar{position:absolute;top:11px;height:24px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,#fff);border:1px solid color-mix(in srgb,var(--c) 40%,#fff);overflow:hidden;cursor:pointer}
.tl-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.85}
.tl-bar span{position:relative;font-size:11.5px;font-weight:600;padding:0 9px;line-height:22px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.25)}
.tl-bar span.lo{color:color-mix(in srgb,var(--c) 75%,#2b2540);text-shadow:none}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--pk);z-index:2}
.tl-today.lab::after{content:"วันนี้";position:absolute;top:-1px;left:4px;font-size:10.5px;color:var(--pk);font-weight:600;background:#fff;padding:0 3px;border-radius:4px;white-space:nowrap}
.tl-ms{position:absolute;top:17px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:#fff;border:2px solid var(--c);z-index:1;cursor:pointer}

/* team */
.tgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.mhd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mav{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px}
.mhd b{display:block}.mhd small{color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mstats div{background:var(--soft);border-radius:12px;padding:8px 10px;text-align:center}
.mstats b{display:block;font-size:20px;font-weight:600;line-height:1.2}
.mstats small{font-size:12px;color:var(--muted)}
.mstats .r b{color:var(--red)}
.load{height:6px;border-radius:99px;background:#f1edf8;overflow:hidden;margin:2px 0 10px}
.load i{display:block;height:100%;background:linear-gradient(90deg,#6ee7b7,#a78bfa,#f472b6)}

/* report */
.rgrid{grid-template-columns:320px 1fr;align-items:start}
.rp{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:14px;cursor:pointer}
.rp input{margin-top:5px;accent-color:var(--p)}
#repText{font-family:inherit;font-size:14px;line-height:1.7;min-height:460px;background:#fdfcff}
.field{display:grid;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}

/* settings */
.sgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.sgrid p{font-size:14px;color:var(--muted);margin:6px 0 12px}
.brow{display:flex;gap:8px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;background:rgba(43,37,64,.28);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(60,30,120,.4);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mhead{display:flex;align-items:center;padding:18px 22px 6px}
.mhead h3{font-size:18px;flex:1}
#mform{padding:8px 22px 20px;display:grid;gap:12px}
#mform label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mfoot{display:flex;gap:8px;align-items:center;padding-top:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw input{display:none}
.sw span{display:block;width:28px;height:28px;border-radius:9px;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* planner */
.grip{touch-action:none;cursor:grab;color:#c9bde3;display:grid;place-items:center;padding:3px 1px;flex-shrink:0;border-radius:6px}
.grip:hover{color:var(--p);background:var(--soft)}
body.is-dragging,body.is-dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.drag-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.96;box-shadow:0 20px 40px -12px rgba(90,60,160,.55);margin:0!important}
.dragging{opacity:.3}
[data-drop].over{outline:2px dashed var(--p);outline-offset:-2px;background:#f1eaff!important}
.plan-wrap{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
.inbox{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;transition:.15s}
.dump{display:grid;gap:8px;margin-bottom:10px}
.inbox .ch h3{white-space:nowrap}
.dump textarea{min-height:72px;background:linear-gradient(180deg,#fff,#fdfbff)}
.drow{display:flex;gap:8px}.drow select{flex:1;min-width:0;font-size:13px;padding:5px 8px}
select.mini{width:auto;max-width:140px;font-size:12.5px;padding:4px 8px}

.pick{border:0;background:var(--soft);color:var(--p);border-radius:9px;padding:6px;display:grid;place-items:center;flex-shrink:0}

.stale{background:#fff9ef;border:1px solid #fbe3b9;border-radius:14px;padding:10px 10px 4px;margin:4px 0 12px}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 2px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}

.day.today{border-color:#cbb6fb;background:linear-gradient(180deg,#f4edff,#fff 140px)}
.day.wkend{background:rgba(253,250,255,.9)}
.dh{display:flex;align-items:center;gap:6px;padding:0 2px 4px}
.dh b{font-size:21px;font-weight:600;line-height:1}
.dh small{color:var(--muted);font-size:12px;line-height:1.2}
.day.today .dh b{color:#7c3aed}
.dadd{padding:2px 4px;margin-left:auto}
.pc2{display:flex;gap:4px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:11px;padding:6px 6px 6px 2px;font-size:13px;line-height:1.35;transition:.15s}
.pc2:hover{box-shadow:0 6px 14px -10px rgba(90,60,160,.45)}
.pc2 .tmain{padding-top:1px}
.pc2 .pn2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pc2 .chk{width:18px;height:18px;border-radius:6px;margin-top:0}
.pc2.done{background:#fafdfb}.pc2.done .t{text-decoration:line-through;color:var(--muted)}
.pc2.done .chk{background:var(--g);border-color:var(--g)}
.dl{--c:var(--red);font-size:11.5px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:8px;padding:3px 7px;display:flex;gap:4px;align-items:center;cursor:pointer;min-width:0}
.dl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.pe{color:#fff;background:var(--c)}
.dz{flex:1;min-height:56px;border:1.5px dashed #ece4f8;border-radius:11px;display:grid;place-items:center;color:#cfc5e2;font-size:12px;text-align:center;padding:6px}
.cev.pl{background:var(--c);color:#fff}
.cev.dd{background:#fff;border:1px dashed var(--c)}
.plan{color:#7c3aed;font-weight:500}
.daypick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.daypick .btn{justify-content:flex-start;padding:10px 12px}
.daypick .btn span{margin-left:auto;font-size:12px;color:var(--muted)}
.daypick .btn.pri span{color:#fff;opacity:.85}
.kcard{position:relative}
.kgrip{position:absolute;right:6px;top:6px;padding:3px}

@media (max-width:1800px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}.day{min-height:240px}}

/* mobile */

  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px;scrollbar-width:none}
  .bnav::-webkit-scrollbar{display:none}

  .bnav .nav-btn .cnt{display:none}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;box-shadow:0 12px 24px -8px rgba(168,85,247,.7);z-index:41}
  .kanban{grid-template-columns:repeat(4,82vw);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -14px;padding-left:14px;padding-right:14px}
  .kcol{scroll-snap-align:center}

  .week{grid-template-columns:1fr}.day{min-height:auto}.dz{min-height:40px}

  .cd{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  .cdn{width:100%;height:auto;border-radius:6px}

  .tl-name{width:140px}
  .mbox{border-radius:22px 22px 0 0;max-height:94vh;align-self:flex-end}
  .modal{padding:0}
  #repText{min-height:340px}
}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">PM</div><div><b>PM Desk</b><small>บริหารโครงการส่วนตัว</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="wrap">
    <header class="top">
      <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
      <div class="acts" id="actions"></div>

    <main id="main"></main>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<button class="fab" data-act="newTask" aria-label="เพิ่มงาน"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
/* ================== utilities ================== */
const $=s=>document.querySelector(s);
const KEY='pmdesk-v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmtISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>fmtISO(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return fmtISO(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const thDate=(iso,o)=>iso?new Date(iso+'T00:00:00').toLocaleDateString('th-TH',o||{day:'numeric',month:'short',year:'2-digit'}):'–';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firstChar=s=>Array.from(String(s||'?').trim())[0]||'?';

const IP={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 folder:'<path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H9l2 2.5h7.5A2.5 2.5 0 0 1 21 9v8.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>',
 board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 timeline:'<path d="M4 6h9M8 12h12M4 18h7"/>',
 team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5a5 5 0 0 1 5 5"/>',
 report:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="M15 18l-6-6 6-6"/>',next:'<path d="M9 18l6-6-6-6"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',upload:'<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
 grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
 inbox:'<path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IP[n]||''}</svg>`;

const STATUS={todo:{t:'ต้องทำ',c:'#9b92b3'},doing:{t:'กำลังทำ',c:'#8b5cf6'},review:{t:'รอตรวจ',c:'#ec4899'},done:{t:'เสร็จแล้ว',c:'#10b981'}};
const ORDER=['todo','doing','review','done'];
const PSTATUS={planning:{t:'วางแผน',c:'#a78bfa'},active:{t:'ดำเนินการ',c:'#8b5cf6'},hold:{t:'พักไว้',c:'#f59e0b'},done:{t:'ปิดโครงการ',c:'#10b981'}};
const PRIO={high:{t:'ด่วน'},med:{t:'ปกติ'},low:{t:'ไม่เร่ง'}};
const COLORS=['#8b5cf6','#ec4899','#10b981','#a855f7','#f472b6','#14b8a6','#6366f1','#f59e0b'];

/* ================== data ================== */
function newTaskObj(o={}){return Object.assign({id:uid(),title:'',projectId:'',assignee:'me',status:'todo',prio:'med',due:'',plan:'',notes:'',created:todayISO()},o)}
function seed(){
  const t=todayISO(),d=n=>addDays(t,n);
  const P=(id,name,client,manager,status,s,e,color,desc)=>({id,name,client,manager,status,start:d(s),end:d(e),color,desc,notes:[]});
  const projects=[
    P('p1','รายงานสิ่งแวดล้อมลุ่มน้ำ (ตัวอย่าง)','หน่วยงาน ก','ผู้จัดการ A','active',-150,75,COLORS[0],'โครงการตัวอย่าง — แก้ไขหรือลบได้'),
    P('p2','แผนหลักการบริหารจัดการลุ่มน้ำ (ตัวอย่าง)','หน่วยงาน ข','ผู้จัดการ A','active',-220,35,COLORS[2],'โครงการตัวอย่าง'),
    P('p3','ระบบจำลองน้ำท่วมเมือง (ตัวอย่าง)','','ผู้จัดการ B','active',-60,210,COLORS[1],'โครงการตัวอย่าง'),
    P('p4','ปรับปรุงรายงาน EIA (ตัวอย่าง)','','ผู้จัดการ B','active',-40,20,COLORS[5],'โครงการตัวอย่าง'),
    P('p5','ข้อเสนอโครงการใหม่ (ตัวอย่าง)','หน่วยงาน ค','ผู้จัดการ A','planning',-7,28,COLORS[3],'จัดทำข้อเสนอทางเทคนิค'),
    P('p6','ข้อเสนอขอทุนวิจัย (ตัวอย่าง)','','ผู้จัดการ B','planning',-20,45,COLORS[4],'โครงการตัวอย่าง'),
  ];
  const T=(p,title,a,status,prio,due,doneAgo)=>{const x=newTaskObj({projectId:p,title,assignee:a,status,prio,due:due==null?'':d(due)});if(status==='done')x.completedAt=d(-(doneAgo??3));return x};
  const tasks=[
    T('p1','รวบรวมข้อมูลคุณภาพน้ำรายสถานี','m2','done','med',-10,8),
    T('p1','วิเคราะห์แนวโน้มคุณภาพน้ำ','m2','doing','high',4),
    T('p1','ร่างบทที่ 3 สภาพแวดล้อมปัจจุบัน','me','todo','med',12),
    T('p1','เตรียมสไลด์ประชุมความก้าวหน้า','me','review','high',2),
    T('p2','สอบเทียบแบบจำลองน้ำท่า','m2','done','high',-6,5),
    T('p2','ร่างรายงานฉบับกลาง (Interim)','me','doing','high',-2),
    T('p2','จัดทำแผนที่ขอบเขตลุ่มน้ำย่อย','m3','done','med',-15,12),
    T('p2','สรุปความเห็นจากการประชุมรับฟัง','me','todo','med',9),
    T('p3','ออกแบบโครงสร้างฐานข้อมูล','m3','doing','med',6),
    T('p3','ตั้งค่า pipeline ข้อมูลฝน real-time','m2','todo','high',14),
    T('p3','ทบทวนผลจำลอง 1D/2D','me','todo','low',30),
    T('p4','ตอบข้อคิดเห็นผู้ชำนาญการ','me','doing','high',1),
    T('p4','ปรับมาตรการลดผลกระทบ','m2','todo','med',8),
    T('p5','ศึกษาแผนปฏิบัติราชการฉบับเดิม','me','done','med',-3,2),
    T('p5','ร่างแนวทางและวิธีการศึกษา','me','doing','high',7),
    T('p5','จัดทำตารางบุคลากรและแผนงาน','m2','todo','med',15),
    T('p6','ร่าง Concept note','me','review','med',3),
    T('p6','ประมาณการงบประมาณ','me','todo','med',20),
  ];
  const pl={1:0,3:0,5:-1,11:1,16:1,14:2,8:3,6:-5};Object.entries(pl).forEach(([i,n])=>tasks[i].plan=d(n));
  ['โทรนัดประชุมทีมเรื่องแผนงานเดือนหน้า','ส่งใบเบิกค่าเดินทางลงพื้นที่','อ่านคู่มือ HEC-RAS 2D บทที่ 4','ตามไฟล์ shapefile ขอบเขตลุ่มน้ำ'].forEach((title,i)=>tasks.push(newTaskObj({title,projectId:i===3?'p2':'',prio:i===1?'high':'med'})));
  projects[0].notes=[{id:uid(),date:d(-5),text:'ประชุมความก้าวหน้ากับผู้ว่าจ้าง\n• ขอให้เพิ่มข้อมูลคุณภาพน้ำย้อนหลัง 10 ปี\n• นัดส่งร่างบทที่ 3 ภายในสิ้นเดือน'}];
  projects[1].notes=[{id:uid(),date:d(-2),text:'คณะกรรมการตรวจรับให้ปรับรูปแบบรายงานฉบับกลางตามเทมเพลตใหม่'}];
  return {v:1,sample:true,owner:'',projects,tasks,
    members:[{id:'me',name:'ฉัน',role:'Project Manager'},{id:'m2',name:'ผู้ช่วย A',role:'วิศวกรแหล่งน้ำ'},{id:'m3',name:'ผู้ช่วย B',role:'GIS'}]};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.projects)&&Array.isArray(d.tasks))return d}}catch(e){}return null}
function save(fromCloud){if(!fromCloud){S.updatedAt=Date.now();window.cloudPush&&window.cloudPush()}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('บันทึกไม่สำเร็จ — เบราว์เซอร์อาจปิดการเก็บข้อมูล')}}
function replaceState(d){Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{members:[],projects:[],tasks:[]},d);S.projects.forEach(p=>p.notes=p.notes||[])}

const S=load()||seed();
const ui={calMode:'week',wk:todayISO(),ibp:'',dumpP:'',view:'dash',proj:null,fp:'',fa:'',q:'',pf:'open',cal:new Date(),repDays:'7',repSel:null,repMgr:''};

/* ================== helpers ================== */
const projOf=t=>S.projects.find(p=>p.id===t.projectId);
const memOf=t=>S.members.find(m=>m.id===t.assignee);
const projTasks=pid=>S.tasks.filter(t=>t.projectId===pid);
const isOverdue=t=>t.status!=='done'&&t.due&&t.due<todayISO();
const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');
const prioRank={high:0,med:1,low:2};
const sortTask=(a,b)=>a.status==='done'&&b.status==='done'?(b.completedAt||'').localeCompare(a.completedAt||''):(prioRank[a.prio]-prioRank[b.prio])||byDue(a,b);
function progress(pid){const ts=projTasks(pid);return ts.length?Math.round(ts.filter(t=>t.status==='done').length/ts.length*100):0}
function health(p){
  if(p.status==='done')return{t:'ปิดแล้ว',c:'#10b981'};
  if(p.status==='hold')return{t:'พักไว้',c:'#f59e0b'};
  const t=todayISO(),pr=progress(p.id);
  if(p.end&&t>p.end)return{t:'เลยกำหนดโครงการ',c:'#e5486f'};
  if(p.start&&p.end&&t>=p.start){const tot=daysBetween(p.start,p.end)||1;const el=daysBetween(p.start,t)/tot*100;if(el-pr>25)return{t:'เสี่ยงล่าช้า',c:'#f59e0b'}}
  if(projTasks(p.id).some(isOverdue))return{t:'มีงานเกินกำหนด',c:'#f59e0b'};
  return{t:'ตามแผน',c:'#10b981'};
}
function setStatus(t,s){if(s==='done'&&t.status!=='done')t.completedAt=todayISO();if(s!=='done')delete t.completedAt;t.status=s}
function dueLabel(iso,done){
  if(!iso)return'';const n=daysBetween(todayISO(),iso);let c='',x;
  if(done)x='ส่ง '+thDate(iso);else if(n<0){c='late';x='เกินกำหนด '+(-n)+' วัน'}else if(n===0){c='late';x='ส่งวันนี้'}else if(n===1){c='soon';x='ส่งพรุ่งนี้'}else if(n<=7){c='soon';x='ส่งในอีก '+n+' วัน'}else x='ส่ง '+thDate(iso);
  return`<span class="due ${c}" title="กำหนดส่ง ${thDate(iso,{day:'numeric',month:'long',year:'numeric'})}">${ic('clock',13)}${x}</span>`;
}

function vTimeline(){
  const ps=S.projects.filter(p=>p.start&&p.end&&p.end>=p.start).sort((a,b)=>a.start.localeCompare(b.start));
  if(!ps.length)return{title:'ไทม์ไลน์',html:'<div class="card empty">ใส่วันเริ่มและวันสิ้นสุดให้โครงการเพื่อดูไทม์ไลน์</div>'};
  const t=todayISO();let mn=ps.reduce((m,p)=>p.start<m?p.start:m,t),mx=ps.reduce((m,p)=>p.end>m?p.end:m,t);
  const s=new Date(mn+'T00:00:00');s.setDate(1);const e=new Date(mx+'T00:00:00');e.setMonth(e.getMonth()+1,1);
  const S0=fmtISO(s),span=daysBetween(S0,fmtISO(e));const pos=iso=>daysBetween(S0,iso)/span*100;
  const months=[];for(let d=new Date(s);d<e;){const n=new Date(d.getFullYear(),d.getMonth()+1,1);months.push({l:d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'}),x:pos(fmtISO(d)),w:pos(fmtISO(n))-pos(fmtISO(d))});d=n}
  const grid=months.map(m=>`<div class="tl-g" style="left:${m.x}%"></div>`).join('');const tp=pos(t);
  const rows=ps.map((p,i)=>{const pr=progress(p.id),l=pos(p.start),w=Math.max(.8,pos(addDays(p.end,1))-l);
    const ms=projTasks(p.id).filter(x=>x.due&&x.prio==='high'&&x.status!=='done'&&x.due>=S0);
    return`<div class="tl-row"><div class="tl-name" data-act="openProject" data-id="${p.id}"><i style="background:${p.color}"></i><span title="${esc(p.name)}">${esc(p.name)}</span></div>
    <div class="tl-track">${grid}<div class="tl-today ${i===0?'lab':''}" style="left:${tp}%"></div>
      <div class="tl-bar" style="left:${l}%;width:${w}%;--c:${p.color}" data-act="openProject" data-id="${p.id}" title="${thDate(p.start)} – ${thDate(p.end)}"><i style="width:${pr}%"></i><span class="${pr<20?'lo':''}">${pr}%</span></div>
      ${ms.map(x=>`<div class="tl-ms" style="left:${pos(x.due)}%;--c:${p.color}" data-act="editTask" data-id="${x.id}" title="งานด่วน: ${esc(x.title)} (${thDate(x.due)})"></div>`).join('')}
    </div></div>`}).join('');
  const html=`<div class="card tl"><div class="tl-in"><div class="tl-head"><div class="tl-name" style="cursor:default;color:var(--muted)">โครงการ</div><div class="tl-months">${months.map(m=>`<div class="tl-m" style="left:${m.x}%;width:${m.w}%">${m.l}</div>`).join('')}</div></div>${rows}</div>
  <div class="legend" style="margin-top:12px"><span><b style="background:var(--pk);width:3px"></b>วันนี้</span><span>◇ งานด่วนที่ยังไม่เสร็จ</span><span>แถบเข้ม = ความคืบหน้า</span></div></div>`;
  return{title:'ไทม์ไลน์',sub:'ภาพรวมระยะเวลาโครงการทั้งหมด',html};
}

function buildReport(){
  const t=todayISO(),days=+ui.repDays,from=addDays(t,-days+1),next=addDays(t,7);
  const ids=ui.repSel||S.projects.filter(p=>p.status!=='done').map(p=>p.id);
  let o=`รายงานความก้าวหน้า ${thDate(from,{day:'numeric',month:'short'})} – ${thDate(t,{day:'numeric',month:'short',year:'numeric'})}\n`;
  if(ui.repMgr)o+=`เรียน ${ui.repMgr}\n`;
  if(S.owner)o+=`ผู้รายงาน: ${S.owner}\n`;
  const nm=x=>{const m=memOf(x);return m&&m.id!=='me'?` [${m.name}]`:''};
  const sect=(h,arr,f=()=> '')=>{if(arr.length){o+=`  ${h}\n`;arr.forEach(x=>o+=`    – ${x.title}${f(x)}${nm(x)}\n`)}};
  ids.forEach(id=>{const p=S.projects.find(x=>x.id===id);if(!p)return;const ts=projTasks(id);
    const done=ts.filter(x=>x.status==='done'&&x.completedAt&&x.completedAt>=from);
    const doing=ts.filter(x=>x.status==='doing'||x.status==='review');
    const od=ts.filter(isOverdue);
    const up=ts.filter(x=>x.status==='todo'&&x.due&&x.due>=t&&x.due<=next);
    const nts=(p.notes||[]).filter(n=>n.date>=from).sort((a,b)=>a.date.localeCompare(b.date));
    o+=`\n■ ${p.name}\n  ความคืบหน้า ${progress(id)}% · สถานะ: ${health(p).t}\n`;
    sect('✓ ดำเนินการแล้ว',done);
    sect('▸ อยู่ระหว่างดำเนินการ',doing,x=>x.status==='review'?' (รอตรวจ)':'');
    sect('! เกินกำหนด',od,x=>` (กำหนด ${thDate(x.due)})`);
    sect('→ แผนงาน 7 วันข้างหน้า',up,x=>` (${thDate(x.due)})`);
    if(nts.length){o+='  📝 ประเด็นสำคัญ\n';nts.forEach(n=>o+=`    – ${thDate(n.date,{day:'numeric',month:'short'})}: ${n.text.replace(/\n+/g,' ')}\n`)}
    if(!done.length&&!doing.length&&!od.length&&!up.length&&!nts.length)o+='  – ไม่มีความเคลื่อนไหวในช่วงนี้\n';
  });
  return o;
}

function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML='';if(window.pendingRemote){const d=window.pendingRemote;window.pendingRemote=null;window.applyRemote(d)}}
function modal(title,body,{onSave,onDelete,saveText='บันทึก',delText='ลบ',foot=true}={}){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox"><div class="mhead"><h3>${title}</h3><button type="button" class="x" data-close>×</button></div>
  <form id="mform">${body}${foot?`<div class="mfoot">${onDelete?`<button type="button" class="btn danger" id="mdel">${delText}</button>`:''}<span class="sp"></span><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn pri">${saveText}</button></div>`:''}</form></div>`;
  m.classList.remove('hidden');
  m.querySelector('#mform').onsubmit=e=>{e.preventDefault();if(!onSave)return;const fd=Object.fromEntries(new FormData(e.target));if(onSave(fd)!==false)closeModal()};
  if(onDelete)m.querySelector('#mdel').onclick=()=>{if(confirm('ยืนยันการลบ?')){onDelete();closeModal()}};
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  m.onmousedown=e=>{if(e.target===m)closeModal()};
  setTimeout(()=>{const f=m.querySelector('input[name=title],input[name=name]');if(f&&window.innerWidth>820)f.focus()},60);
}

/* ================== drag & drop (mouse + touch) ================== */
let drag=null,suppressClick=false;
function dropTarget(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('[data-drop]')}
document.addEventListener('pointerdown',e=>{
  const src=e.target.closest('[data-drag]');if(!src||e.button>0)return;
  if(e.target.closest('button,input,select,textarea,a'))return;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
  drag={id:src.dataset.drag,src,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,on:false};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.on){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
    const r=drag.src.getBoundingClientRect();drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;
    const g=drag.src.cloneNode(true);g.classList.add('drag-ghost');g.style.width=r.width+'px';document.body.appendChild(g);drag.g=g;
    drag.src.classList.add('dragging');document.body.classList.add('is-dragging');window.getSelection()?.removeAllRanges();drag.on=true;
    drag.timer=setInterval(()=>{if(!drag)return;const m=70;
      if(drag.y<m)window.scrollBy(0,-14);else if(drag.y>innerHeight-m-(innerWidth<=820?70:0))window.scrollBy(0,14);
      const k=document.querySelector('.kanban');if(k&&innerWidth<=820){if(drag.x<36)k.scrollLeft-=14;else if(drag.x>innerWidth-36)k.scrollLeft+=14}
      const inb=document.querySelector('.inbox');if(inb&&inb.scrollHeight>inb.clientHeight){const r2=inb.getBoundingClientRect();if(drag.x>=r2.left&&drag.x<=r2.right){if(drag.y<r2.top+40)inb.scrollTop-=12;else if(drag.y>r2.bottom-40)inb.scrollTop+=12}}
      hover()},30);
  }
  e.preventDefault();
  drag.g.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(1.5deg)`;
  hover();
},{passive:false});
function hover(){const t=dropTarget(drag.x,drag.y);if(t!==drag.over){drag.over&&drag.over.classList.remove('over');t&&t.classList.add('over');drag.over=t}}
function endDrag(apply){
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  clearInterval(d.timer);d.g.remove();d.src.classList.remove('dragging');document.body.classList.remove('is-dragging');d.over&&d.over.classList.remove('over');
  suppressClick=true;setTimeout(()=>suppressClick=false,60);
  if(!apply||!d.over)return;
  const t=S.tasks.find(x=>x.id===d.id);if(!t)return;const [k,v]=d.over.dataset.drop.split(':');
  if(k==='plan'){if((t.plan||'')===v)return;t.plan=v;toast(v?'📌 '+planLabel(v):'กลับเข้ากองงานแล้ว')}
  if(k==='status'){if(t.status===v)return;setStatus(t,v);toast('ย้ายไป “'+STATUS[v].t+'”')}
  save();render();
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('click',e=>{if(suppressClick){suppressClick=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('[data-drag]'))e.preventDefault()});

route();history.replaceState(null,'',hashFor());render();
</script>
